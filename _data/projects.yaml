# group: lead (projects I lead) | participant (projects I take part in)

- title: URBANOMICS
  subtitle: Principal Investigator · 2026–
  group: lead
  image: images/project-urbanomics.jpg
  description: Dissecting the genomic basis of adaptation to urban environments in the _Culex pipiens_ mosquito, combining contemporary and historical genomes. Funded by the UAB (PPC 2026, Emerging leaderships). In collaboration with the IRD (Diego Ayala).

- title: CATick
  subtitle: Principal Investigator (co-PI Óscar Cabezón) · 2026–2027
  group: lead
  image: images/project-catick.jpg
  description: Genome assembly of the tick species present in Catalonia. Funded by the Institut d'Estudis Catalans within the Catalan Biogenome Project.

- title: RES supercomputing allocation
  subtitle: Team Leader · 2026
  group: lead
  image: images/project-res.jpg
  description: Processing of tissue-specific transcriptomics and epigenomics datasets from ecologically relevant _Drosophila_ species. 40,000 CPU hours on Finis Terrae III (CESGA), Spanish Supercomputing Network (BCV-2026-1-0052).

